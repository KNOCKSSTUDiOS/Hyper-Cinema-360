version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "deps"
      include: "scope"

    labels:
      - "dependencies"
      - "auto-update"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
